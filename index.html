<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>51 -> 34</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
<style>
  body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
  input{width:95%;font-size:15px;padding:12px;border-radius:10px;border:none;text-align:center}
  button{font-size:20px;padding:12px 25px;margin-top:15px;border-radius:10px;background:#00ff88;border:none;font-weight:bold}
  #saida{font-size:18px;margin-top:20px;color:#00ff88;font-weight:bold;word-break:break-all}
  #erro{color:#ff5555;margin-top:10px;word-break:break-all}
  #cont{color:#aaa;margin-top:8px}
</style>
</head>
<body>
<h1>51 -> 34</h1>
<input id="entrada" placeholder="5K..." oninput="document.getElementById('cont').innerText='Você colou: '+this.value.length+' / 51'" />
<div id="cont">Você colou: 0 / 51</div>
<br><button onclick="gerar()">GERAR ENDEREÇO</button>
<div id="saida">-</div>
<div id="erro"></div>
<script>
const ALPH="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58decode(s){let n=0n;for(let c of s)n=n*58n+BigInt(ALPH.indexOf(c));let h=n.toString(16);if(h.length%2)h="0"+h;let b=[];for(let i=0;i<h.length;i+=2)b.push(parseInt(h.slice(i,i+2),16));let z=0;for(let c of s){if(c!=='1')break;z++;}return new Uint8Array([...new Array(z).fill(0),...b]);}
function b58encode(bytes){let n=0n;for(let b of bytes)n=n*256n+BigInt(b);let s="";while(n>0n){s=ALPH[Number(n%58n)]+s;n/=58n;}let z=0;for(let b of bytes){if(b!==0)break;z++;}return "1".repeat(z)+s;}
function hexToBytes(hex){let b=[];for(let i=0;i<hex.length;i+=2)b.push(parseInt(hex.slice(i,i+2),16));return new Uint8Array(b);}
function bytesToHex(b){return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function gerar(){
  let wif=document.getElementById("entrada").value.trim();
  document.getElementById("erro").innerText="";
  if(typeof CryptoJS==="undefined"){document.getElementById("erro").innerText="ERRO: CryptoJS não carregou. Abre com Wi-Fi.";return;}
  if(typeof elliptic==="undefined"){document.getElementById("erro").innerText="ERRO: elliptic não carregou.";return;}
  if(wif.length!==51){document.getElementById("erro").innerText="Você colou "+wif.length+" / 51. Cola completa.";return;}
  try{
    let dec=b58decode(wif);
    let privHex=bytesToHex(dec.slice(1,33));
    let ec=new elliptic.ec('secp256k1');
    let key=ec.keyFromPrivate(privHex,'hex');
    let pubHex=key.getPublic(false,'hex');
    let pubBytes=hexToBytes(pubHex);
    let sha=CryptoJS.SHA256(CryptoJS.lib.WordArray.create(pubBytes));
    let rip=CryptoJS.RIPEMD160(sha);
    let h160=hexToBytes(rip.toString(CryptoJS.enc.Hex));
    let payload=new Uint8Array(21);payload[0]=0;payload.set(h160,1);
    let chk1=CryptoJS.SHA256(CryptoJS.lib.WordArray.create(payload));
    let chk2=CryptoJS.SHA256(chk1);
    let chk=hexToBytes(chk2.toString(CryptoJS.enc.Hex).slice(0,8));
    let full=new Uint8Array(25);full.set(payload,0);full.set(chk,21);
    let addr=b58encode(full);
    document.getElementById("saida").innerText=addr+" ("+addr.length+")";
  }catch(e){document.getElementById("erro").innerText="Erro: "+e.message;}
}
</script>
</body>
</html>
